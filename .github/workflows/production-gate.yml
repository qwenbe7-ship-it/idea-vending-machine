name: Production Gate

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run production gate
        run: python scripts/verify.py

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install browser test dependency
        run: python -m pip install -r requirements-e2e.txt
      - name: Install Chromium
        run: python -m playwright install chromium --with-deps
      - name: Run Chromium browser gate
        run: python scripts/verify_browser.py
